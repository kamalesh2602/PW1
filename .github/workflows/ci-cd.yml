name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-validation:
    name: Python Validation & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Perform Python syntax checks
        run: |
          echo "Compiling Python source files to check syntax..."
          python -m compileall -q backend/app/ backend/tests/
          python -c "import ast, glob, sys; files = [f for f in glob.glob('backend/**/*.py', recursive=True) if 'venv' not in f and '.pytest_cache' not in f]; [ast.parse(open(f, encoding='utf-8').read(), filename=f) for f in files]; print(f'Syntax validation passed for {len(files)} Python files.')"

      - name: Run existing Python unit tests
        run: |
          python -m pytest backend/tests/test_evaluation.py backend/tests/test_curator.py backend/tests/test_traces.py backend/tests/test_mcp_tools.py -v

  java-validation:
    name: Java Validation & Compilation Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python for test runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Verify Java environment
        run: |
          java -version
          javac -version

      - name: Compile Java source files & benchmarks
        run: |
          echo "Compiling repository Java source files if present..."
          if [ -n "$(find . -name '*.java' -not -path '*/.*' 2>/dev/null)" ]; then
            javac -d ./target $(find . -name '*.java' -not -path '*/.*')
          fi

          echo "Compiling all Java benchmark programs..."
          python -c "
          import sys, tempfile, subprocess
          from pathlib import Path
          sys.path.insert(0, 'backend')
          from app.evaluation.benchmarks import JAVA_BENCHMARKS
          from app.services.executors.java_executor import JavaExecutor

          executor = JavaExecutor()
          count = 0
          with tempfile.TemporaryDirectory() as tmpdir:
              for bug_id, bench in sorted(JAVA_BENCHMARKS.items()):
                  pkg, cls_name, filename = executor.extract_java_metadata(bench.code)
                  file_path = Path(tmpdir) / filename
                  file_path.write_text(bench.code, encoding='utf-8')
                  res = subprocess.run(['javac', '-d', tmpdir, filename], cwd=tmpdir, capture_output=True, text=True)
                  if res.returncode != 0:
                      print(f'Compilation error in {bug_id} ({filename}):\n{res.stderr}', file=sys.stderr)
                      sys.exit(1)
                  count += 1
                  print(f'Compiled {bug_id} ({cls_name}.class): OK')
          print(f'All {count} Java benchmarks compiled successfully with javac!')
          "

      - name: Run existing Java execution unit tests
        run: |
          python -m pytest backend/tests/test_execution.py -k "java" -v

  general-checks:
    name: General Integration & Health Checks
    runs-on: ubuntu-latest
    needs: [python-validation, java-validation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Verify application startup & health endpoint
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'backend')
          os.environ.setdefault('OPENROUTER_API_KEY', 'ci_test_key')
          os.environ.setdefault('GROQ_API_KEY', 'ci_test_key')
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)
          res = client.get('/health')
          assert res.status_code == 200, f'Health check returned {res.status_code}'
          data = res.json()
          assert data.get('status') == 'ok', f'Unexpected status: {data}'
          print('FastAPI application health check passed:', data)
          "

      - name: Verify benchmark catalog integrity (Python & Java)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'backend')
          from app.evaluation.benchmarks import PYTHON_BENCHMARKS, JAVA_BENCHMARKS, get_all_benchmarks

          py_cases = get_all_benchmarks('python')
          ja_cases = get_all_benchmarks('java')
          assert len(py_cases) == 10, f'Expected 10 Python benchmark cases, found {len(py_cases)}'
          assert len(ja_cases) == 10, f'Expected 10 Java benchmark cases, found {len(ja_cases)}'

          for case in py_cases + ja_cases:
              assert case.bug_id and case.language and case.code, f'Invalid benchmark: {case}'
          print(f'Benchmark integrity verified: 10 Python cases and 10 Java cases valid.')
          "

      - name: Verify experiment dataset schema & consistency
        run: |
          python -c "
          import csv, sys
          from pathlib import Path

          master_csv = Path('backend/data/m8/m8_experiments.csv')
          assert master_csv.exists(), 'Master CSV dataset missing!'

          with open(master_csv, encoding='utf-8') as f:
              reader = csv.DictReader(f)
              rows = list(reader)

          assert len(reader.fieldnames) == 31, f'Expected 31 CSV columns, got {len(reader.fieldnames)}'
          assert len(rows) >= 61, f'Expected at least 61 records in dataset, found {len(rows)}'
          print(f'Dataset schema verified: {len(rows)} records with 31 columns intact.')
          "

      - name: Run cross-language execution tests
        run: |
          python -m pytest backend/tests/test_execution.py -v
